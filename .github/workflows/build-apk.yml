name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract and clean plugins
      run: |
        if [ -f "junk-cleaner-pro.zip" ]; then
          mkdir -p temp_zip
          unzip -q -o junk-cleaner-pro.zip -d temp_zip
          if [ -d temp_zip/app ]; then
            cp -r temp_zip/* .
          else
            cp -r temp_zip/*/* . 2>/dev/null || true
          fi
          rm -rf temp_zip
        fi

        # Remove problematic plugins for pure debug build
        sed -i '/secrets-gradle-plugin/d' build.gradle.kts || true
        sed -i '/roborazzi/d' build.gradle.kts || true
        sed -i '/secrets.gradle.plugin/d' build.gradle.kts || true
        sed -i '/secrets-gradle-plugin/d' app/build.gradle.kts || true
        sed -i '/secrets {/d' app/build.gradle.kts || true
        sed -i '/roborazzi/d' app/build.gradle.kts || true
        sed -i '/signingConfigs.getByName("debugConfig")/d' app/build.gradle.kts || true
        sed -i '/signingConfig = signingConfigs/d' app/build.gradle.kts || true

        touch .env
        touch secrets.properties

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.8'

    - name: Build APK with Gradle
      run: |
        gradle assembleDebug -x test --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: JunkCleanerPro-APK
        path: "app/build/outputs/apk/debug/*.apk"
