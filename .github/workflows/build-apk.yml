name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Extract project zip
      run: |
        if [ -f "junk-cleaner-pro.zip" ]; then
          unzip -o junk-cleaner-pro.zip -d .
        fi
        touch .env

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Set gradlew executable permission
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x ./gradlew
        else
          gradle wrapper
          chmod +x ./gradlew
        fi

    - name: Build Debug APK
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug --stacktrace
        else
          gradle assembleDebug --stacktrace
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: JunkCleanerPro-APK
        path: "**/build/outputs/apk/debug/*.apk"
