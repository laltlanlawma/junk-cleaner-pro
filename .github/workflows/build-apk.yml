name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Extract project files if zipped
      run: |
        if [ -f "junk-cleaner-pro.zip" ]; then
          unzip -o junk-cleaner-pro.zip -d temp_extract
          # If files are in root of zip or subfolder, copy to root
          if [ -f "temp_extract/build.gradle.kts" ]; then
            cp -r temp_extract/* .
          else
            cp -r temp_extract/*/* . 2>/dev/null || true
          fi
          rm -rf temp_extract
        fi
        touch .env

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Make Gradlew Executable
      run: |
        chmod +x ./gradlew || true

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug -x test --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: JunkCleanerPro-APK
        path: app/build/outputs/apk/debug/*.apk
