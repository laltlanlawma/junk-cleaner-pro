name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Clean and extract clean project
      run: |
        # Make a clean work directory
        mkdir ../clean_build
        if [ -f "junk-cleaner-pro.zip" ]; then
          unzip -q junk-cleaner-pro.zip -d ../clean_build/
        else
          cp -r * ../clean_build/
        fi
        
        # Replace current dir with clean files
        rm -rf *
        cp -r ../clean_build/* . 2>/dev/null || true
        cp -r ../clean_build/.* . 2>/dev/null || true
        
        # Remove AI Studio only signing configuration
        find . -name "build.gradle.kts" -exec sed -i '/signingConfigs.getByName("debugConfig")/d' {} +
        find . -name "build.gradle.kts" -exec sed -i '/signingConfig = signingConfigs/d' {} +
        
        touch .env
        touch secrets.properties

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.10.2'

    - name: Build Debug APK
      run: |
        gradle :app:assembleDebug -x test -x lint -x verifyRoborazziDebug --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: JunkCleanerPro-APK
        path: "app/build/outputs/apk/debug/*.apk"
