name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Unzip & Fix Configurations
      run: |
        if [ -f "junk-cleaner-pro.zip" ]; then
          mkdir -p /tmp/my_app
          unzip -q junk-cleaner-pro.zip -d /tmp/my_app/
          BUILD_DIR=$(find /tmp/my_app -name "settings.gradle.kts" -exec dirname {} \;)
          cp -r $BUILD_DIR/* .
          rm -rf /tmp/my_app
        fi

        # Accept licenses
        yes | sdkmanager --licenses || true
        touch .env
        touch secrets.properties
        touch local.defaults.properties
        echo "sdk.dir=$ANDROID_HOME" > local.properties

        # Remove AI Studio signing line
        find . -name "build.gradle.kts" -exec sed -i '/signingConfigs.getByName("debugConfig")/d' {} +
        find . -name "build.gradle.kts" -exec sed -i '/signingConfig = signingConfigs/d' {} +

    - name: Setup Gradle 8.11.1
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.11.1'

    - name: Build Debug APK
      run: |
        gradle assembleDebug -x test -x lint -x verifyRoborazziDebug -Dorg.gradle.jvmargs="-Xmx3072m" --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: JunkCleanerPro-APK
        path: "**/build/outputs/apk/debug/*.apk"
