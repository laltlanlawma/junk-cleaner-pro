name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Extract zip and fix configuration
      run: |
        if [ -f "junk-cleaner-pro.zip" ]; then
          unzip -o junk-cleaner-pro.zip -d extracted_app
          cp -r extracted_app/* . 2>/dev/null || true
          cp -r extracted_app/.* . 2>/dev/null || true
          rm -rf extracted_app
        fi
        touch .env
        touch secrets.properties
        touch local.defaults.properties
        touch local.properties
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        # Remove custom debugConfig line if present
        if [ -f "app/build.gradle.kts" ]; then
          sed -i '/signingConfig = signingConfigs.getByName("debugConfig")/d' app/build.gradle.kts
        fi

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.10.2'

    - name: Build Debug APK
      run: |
        gradle :app:assembleDebug -x test --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: JunkCleanerPro-APK
        path: app/build/outputs/apk/debug/*.apk
