name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Extract zip and clean workspace
      run: |
        if [ -f "junk-cleaner-pro.zip" ]; then
          mkdir -p extracted_zip
          unzip -q -o junk-cleaner-pro.zip -d extracted_zip
          # If files are nested inside a subfolder in zip
          if [ -d extracted_zip/app ]; then
            cp -r extracted_zip/* .
          else
            cp -r extracted_zip/*/* . 2>/dev/null || true
          fi
          rm -rf extracted_zip
        fi
        
        # Create all needed config files
        touch .env
        touch secrets.properties
        touch local.defaults.properties
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        
        # Remove AI Studio specific signingConfig line that causes build fail
        find . -name "build.gradle.kts" -exec sed -i '/signingConfigs.getByName("debugConfig")/d' {} +
        find . -name "build.gradle.kts" -exec sed -i '/signingConfig = signingConfigs/d' {} +

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.10.2'

    - name: Build Debug APK
      run: |
        gradle assembleDebug -x test -x lint -x verifyRoborazziDebug --stacktrace --info

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: JunkCleanerPro-APK
        path: "**/build/outputs/apk/debug/*.apk"
