name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Extract zip and clean configs
      run: |
        if [ -f "junk-cleaner-pro.zip" ]; then
          mkdir -p temp_app
          unzip -q -o junk-cleaner-pro.zip -d temp_app
          if [ -d temp_app/app ]; then
            cp -r temp_app/* .
          else
            cp -r temp_app/*/* . 2>/dev/null || true
          fi
          rm -rf temp_app
        fi

        # Accept all Android licenses
        yes | sdkmanager --licenses || true

        # Remove local signing configurations
        find . -name "build.gradle.kts" -exec sed -i '/signingConfigs.getByName("debugConfig")/d' {} +
        find . -name "build.gradle.kts" -exec sed -i '/signingConfig = signingConfigs/d' {} +

        touch .env
        touch secrets.properties

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.10.2'

    - name: Build Debug APK
      run: |
        gradle :app:assembleDebug -x test -x lint --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: JunkCleanerPro-APK
        path: "app/build/outputs/apk/debug/*.apk"
